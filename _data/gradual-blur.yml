# GradualBlur overlays (React Bits <GradualBlur />, vanilla port) on the post
# modal — a blur fade at both the bottom and the top of the reading area.
# Set enabled: false to hide them all. Each entry under `overlays` renders one
# overlay (props map 1:1 to the component table).
enabled: true
overlays:
  - position: bottom
    height: 6rem
    strength: 2
    divCount: 5
    curve: bezier
    exponential: true
    opacity: 1
    zIndex: 2
    animated: false
  - position: top
    height: 4rem
    strength: 1.6
    divCount: 4
    curve: bezier
    exponential: true
    opacity: 1
    zIndex: 2
    animated: false
