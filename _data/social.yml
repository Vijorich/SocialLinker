# badge: "Live"/"New!" chip next to the name, shown by assets/badges.js when fresh.
#   type: twitch (login), youtube (channel_id), telegram (channel).
#   youtube channel_id empty -> badge never renders. Find yours: youtube.com/account_advanced
badge_days: 3
items:
