  - name: YouTube
    url: https://www.youtube.com/@vijor
    icon: youtube
    badge: { type: youtube, channel_id: "" }
  - name: YouTube Second
    url: https://www.youtube.com/@vijorsup
    icon: youtube
    badge: { type: youtube, channel_id: "" }
  - name: Telegram channel
    url: https://t.me/zerotaste
    icon: telegram
    badge: { type: telegram, channel: zerotaste }
  - name: VK community
    url: https://vk.ru/vijorich
