<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0706">
  {% assign t = page.title | default: site.data.profile.nick %}
  <title>{{ t }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="author" content="{{ site.author | escape }}">
  <meta property="og:title" content="{{ t }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ site.data.profile.avatar | absolute_url }}">
  <link rel="icon" href="{{ site.data.profile.avatar | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="{{ '/assets/badges.js' | relative_url }}" defer></script>
</head>
<body>
<a class="skip-link" href="#links">{{ site.data.locale.skip_to_links }}</a>
{{ content }}

<script>
if(window.matchMedia('(hover:hover)').matches&&window.matchMedia('(prefers-reduced-motion:no-preference)').matches){document.querySelectorAll('.link-card').forEach(c=>{c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;c.style.transform=`translate(${dx*8}px,${dy*8}px)`});c.addEventListener('mouseleave',()=>{c.style.transform=''})})}else{document.querySelectorAll('.link-card').forEach(c=>{c.addEventListener('touchstart',()=>{c.style.transform=''})})}
(function(){const a=document.querySelector('.post-article');if(!a)return;const close=document.querySelector('.post-close');const goBack=()=>{if(history.length>1){history.back()}else{location.href='{{ "/" | relative_url }}'}};if(close)close.addEventListener('click',goBack);document.addEventListener('click',e=>{if(e.target.closest('.post-article')||e.target.closest('.post-close')||e.defaultPrevented)return;goBack()})})();
(function(){const cards=document.querySelectorAll('.post-card');if(!cards.length)return;const dlg=document.getElementById('post-modal');
if(!dlg){const back=sessionStorage.getItem('vt-post-href');if(back){sessionStorage.removeItem('vt-post-href');const m=document.querySelector('.post-card[href="'+back+'"]');if(m)m.style.viewTransitionName='post-hero'}cards.forEach(c=>c.addEventListener('click',()=>{cards.forEach(x=>x.style.viewTransitionName='');sessionStorage.setItem('vt-post-href',c.getAttribute('href'));c.style.viewTransitionName='post-hero'}));return}
/* Modal path: Material-3 container transform. The clicked card morphs straight into the
   full article — bounds/radius/color on the box, title + time fly as shared elements, and the
   body resolves inside the growing surface. Fetch-first against a warmed cache, so the morph
   target is always the final size: no loading state, no resize jolt, one seamless motion.
   URL synced: a successful open pushes the post URL (refresh = standalone page = no-JS
   fallback); Back closes, Forward reopens. */
const body=dlg.querySelector('.post-modal-body');
const q=(el,s)=>el&&typeof el.querySelector==='function'?el.querySelector(s):null;
const cls=(el,f,c)=>{if(el&&el.classList&&el.classList[f])el.classList[f](c)};
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const canVT=()=>('startViewTransition'in document)&&!reduced();
let activeCard=null,busy=false,gen=0;
const cache=new Map();
/* getArticle fetches each post once, then serves from cache — a post opened or hover-warmed
   reopens with zero network, so the container always morphs into the real, final-size article. */
async function getArticle(url){if(cache.has(url))return cache.get(url);let art=null;try{const r=await fetch(url);if(r.ok)art=new DOMParser().parseFromString(await r.text(),'text/html').querySelector('.post-article')}catch{}cache.set(url,art);return art}
function fill(card,article){body.innerHTML=article.innerHTML;const t=article.querySelector('.post-title');if(t)dlg.setAttribute('aria-label',t.textContent);activeCard=card}
/* gen: any history event or close invalidates in-flight fetches/VTs, so a stale completion
   can't reopen the modal, push out of order, or clobber a newer morph. */
/* Shared-element names are set inline only on the active card + the modal's current header,
   then cleared after each morph — never more than one of each name in a snapshot. Card→dialog
   on open; dialog→card (mirrored) on close. */
function cardNames(card,on){if(!card)return;card.style.viewTransitionName=on?'post-hero':'';const t=q(card,'.post-title'),d=q(card,'.post-date');if(t&&t.style)t.style.viewTransitionName=on?'post-title':'';if(d&&d.style)d.style.viewTransitionName=on?'post-time':''}
function modalNames(on){const t=q(dlg,'.post-title'),d=q(dlg,'.post-date');if(t&&t.style)t.style.viewTransitionName=on?'post-title':'';if(d&&d.style)d.style.viewTransitionName=on?'post-time':''}
/* The article is filled BEFORE the view transition captures, so the box animates from card
   bounds to the article's final bounds in one continuous grow — title/time fly, body resolves
   inside the surface. A failed fetch falls back to the standalone page. */
async function open(card,push){if(dlg.open||busy)return;busy=true;const g=++gen;const url=card.getAttribute('href');activeCard=card;cls(card,'add','loading');const article=await getArticle(url);cls(card,'remove','loading');if(g!==gen){return}if(!article){busy=false;location.href=url;return}fill(card,article);body.scrollTop=0;let done;const show=()=>{cardNames(card,false);if(g!==gen)return;dlg.showModal()};if(canVT()){cardNames(card,true);const t=document.startViewTransition(()=>{modalNames(true);show()});done=t.finished.catch(()=>{})}else{show();cls(dlg,'add','fade');done=Promise.resolve()}await done;if(g!==gen){busy=false;return}if(push!==false)history.pushState({postModal:url},'',url);busy=false}
async function swap(url,push){const g=++gen;const article=await getArticle(url);if(!article){if(g===gen)location.href=url;return}if(g!==gen)return;const card=[...cards].find(c=>c.getAttribute('href')===url);fill(card||activeCard,article);body.scrollTop=0;if(push!==false)history.pushState({postModal:url},'',url)}
function closeMorph(){const card=activeCard;activeCard=null;const g=++gen;const cleanup=()=>{if(card&&g===gen)cardNames(card,false);modalNames(false);cls(dlg,'remove','fade');cls(document.documentElement,'remove','vt-closing');if(dlg.style){dlg.style.transform='';dlg.style.opacity='';dlg.style.transition=''}};if(canVT()&&card){modalNames(true);cls(document.documentElement,'add','vt-closing');const t=document.startViewTransition(()=>{cardNames(card,true);modalNames(false);dlg.close()});t.finished.then(cleanup,cleanup)}else{dlg.close();cleanup()}}
function close(){if(!dlg.open)return;if(history.state&&history.state.postModal){history.back();return}closeMorph()}
cards.forEach(c=>{c.addEventListener('click',e=>{e.preventDefault();open(c)});if('onpointerover' in c)c.addEventListener('pointerover',()=>getArticle(c.getAttribute('href')))});dlg.querySelector('.post-close').addEventListener('click',close);
dlg.addEventListener('click',e=>{if(e.target===dlg){close();return}const nav=e.target.closest('.post-nav a');if(nav&&dlg.contains(nav)){e.preventDefault();swap(nav.getAttribute('href'))}});
dlg.addEventListener('cancel',e=>{e.preventDefault();close()});
window.addEventListener('popstate',e=>{gen++;busy=false;const u=e.state&&e.state.postModal;if(!u){if(dlg.open)closeMorph();return}const card=[...cards].find(c=>c.getAttribute('href')===u);if(!card){if(dlg.open)closeMorph();location.href=u;return}if(!dlg.open)open(card,false);else if(activeCard!==card)swap(u,false)});
/* Drag-to-dismiss from the post header: pull down to scrub a live preview; release past the
   threshold commits to the mirrored close VT, below it springs back. Header-only so it never
   fights body scroll. */
(function(){if(reduced())return;let y0=0,dy=0,on=false;const THR=120;const end=()=>{if(!on)return;on=false;const commit=dy>THR;if(commit){close()}else{dlg.style.transition='transform .3s cubic-bezier(0.2,0,0,1),opacity .3s';dlg.style.transform='';dlg.style.opacity='';setTimeout(()=>{if(dlg.style)dlg.style.transition=''},320)}};dlg.addEventListener('pointerdown',e=>{if(busy||!dlg.open)return;if(e.button!==undefined&&e.button!==0)return;if(!e.target.closest||!e.target.closest('.post-header'))return;if((body.scrollTop||0)>0)return;on=true;y0=e.clientY;dy=0;try{dlg.setPointerCapture(e.pointerId)}catch{}});dlg.addEventListener('pointermove',e=>{if(!on)return;dy=Math.max(0,e.clientY-y0);const k=Math.min(dy/(dlg.offsetHeight||1),1);dlg.style.transition='none';dlg.style.transform='translateY('+dy+'px)';dlg.style.opacity=String(1-k*0.6)});dlg.addEventListener('pointerup',end);dlg.addEventListener('pointercancel',end)})();
})();
</script>
</body>
</html>
