<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign t = page.title | default: site.data.profile.nick %}
  <title>{{ t }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="author" content="{{ site.author | escape }}">
  <meta property="og:title" content="{{ t }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ site.data.profile.avatar | absolute_url }}">
  <link rel="icon" href="{{ site.data.profile.avatar | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="{{ '/assets/badges.js' | relative_url }}" defer></script>
</head>
<body>
{{ content }}

<script>
if(window.matchMedia('(hover:hover)').matches){document.querySelectorAll('.link-card').forEach(c=>{c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;c.style.transform=`translate(${dx*8}px,${dy*8}px)`});c.addEventListener('mouseleave',()=>{c.style.transform=''})})}else{document.querySelectorAll('.link-card').forEach(c=>{c.addEventListener('touchstart',()=>{c.style.transform=''})})}
(function(){const a=document.querySelector('.post-article');if(!a)return;const close=document.querySelector('.post-close');const goBack=()=>{if(history.length>1){history.back()}else{location.href='{{ "/" | relative_url }}'}};if(close)close.addEventListener('click',goBack);document.addEventListener('click',e=>{if(e.target.closest('.post-article')||e.target.closest('.post-close')||e.defaultPrevented)return;goBack()})})();
(function(){const cards=document.querySelectorAll('.post-card');if(!cards.length)return;const dlg=document.getElementById('post-modal');
if(!dlg){const back=sessionStorage.getItem('vt-post-href');if(back){sessionStorage.removeItem('vt-post-href');const m=document.querySelector('.post-card[href="'+back+'"]');if(m)m.style.viewTransitionName='post-hero'}cards.forEach(c=>c.addEventListener('click',()=>{cards.forEach(x=>x.style.viewTransitionName='');sessionStorage.setItem('vt-post-href',c.getAttribute('href'));c.style.viewTransitionName='post-hero'}));return}
/* Modal path: fetch post page, morph card -> dialog. ponytail: no history/URL sync (add pushState+popstate if asked). */
const body=dlg.querySelector('.post-modal-body');const vt=document.startViewTransition?document.startViewTransition.bind(document):null;let activeCard=null,busy=false;
async function open(card){if(dlg.open||busy)return;busy=true;const url=card.getAttribute('href');let article=null;try{const r=await fetch(url);if(r.ok)article=new DOMParser().parseFromString(await r.text(),'text/html').querySelector('.post-article')}catch{}if(!article){busy=false;location.href=url;return}body.innerHTML=article.innerHTML;const t=article.querySelector('.post-title');if(t)dlg.setAttribute('aria-label',t.textContent);activeCard=card;const show=()=>{card.style.viewTransitionName='';dlg.showModal();busy=false};if(vt){card.style.viewTransitionName='post-hero';vt(show)}else show()}
function close(){if(!dlg.open)return;const card=activeCard;activeCard=null;const cleanup=()=>{if(card)card.style.viewTransitionName=''};if(vt&&card){const t=vt(()=>{dlg.close();card.style.viewTransitionName='post-hero'});t.finished.then(cleanup,cleanup)}else{dlg.close();cleanup()}}
cards.forEach(c=>c.addEventListener('click',e=>{e.preventDefault();open(c)}));dlg.querySelector('.post-close').addEventListener('click',close);dlg.addEventListener('click',e=>{if(e.target===dlg)close()});dlg.addEventListener('cancel',e=>{e.preventDefault();close()})})();
</script>
</body>
</html>
